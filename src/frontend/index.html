<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#222222" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="OpenSession" />
  <link rel="icon" type="image/png" href="/mac-app-icon.png?v=5" />
  <title>OpenSession</title>
  <!-- OpenGraph / Twitter link-preview image — the new OS¹ mark, same asset as
       the favicon, splash and mobile header. Root-relative so it resolves at
       the bare domain root and under the /backstage & /opensession prefixes. -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="OpenSession" />
  <meta property="og:image" content="/mac-app-icon.png?v=5" />
  <meta name="twitter:card" content="summary" />
  <meta name="twitter:title" content="OpenSession" />
  <meta name="twitter:image" content="/mac-app-icon.png?v=5" />
  <!-- Replaced by the production builder. Dev/source builds keep generic defaults. -->
  <script>window.__OPENSESSION_INSTANCE__ = window.__OPENSESSION_INSTANCE__ || {};</script>
  <script>
    // Pre-paint theme: set <html data-theme> from the saved preference (or the
    // OS, when following it) before first paint, so there's no flash of the
    // wrong palette. Mirrors src/frontend/lib/theme.ts — keep the key in sync.
    (function () {
      try {
        var p = localStorage.getItem("opensession-theme");
        if (p === null) {
          // Migrate the pre-rename key once: adopt it, then drop it.
          var legacy = localStorage.getItem("michael-theme");
          if (legacy !== null) {
            p = legacy;
            localStorage.setItem("opensession-theme", legacy);
            localStorage.removeItem("michael-theme");
          }
        }
        var eff = (p === "light" || p === "dark") ? p
          : (window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
        var h = document.documentElement;
        h.setAttribute("data-theme", eff);
        h.style.colorScheme = eff;
        var m = document.querySelector('meta[name="theme-color"]');
        // --bg-raised (sidebar + WCO titlebar surface): the desktop PWA paints
        // the window-controls caption band with theme-color, so match the
        // titlebar. Keep in sync with lib/theme.ts applyTheme().
        if (m) m.setAttribute("content", eff === "light" ? "#f6f6f6" : "#222222");
      } catch (e) {}
    })();
  </script>
  <script>
    // Injected at runtime so the bundler doesn't try to resolve these as build
    // assets — they're served by the OpenSession server, not bundled. The
    // prefix follows the URL this page was served under (/opensession/ primary,
    // /backstage/ legacy alias, or "" at a bare domain root like os.tella.dev)
    // so each install's PWA identity — manifest, start_url, icons — stays
    // self-consistent per prefix. Mirrors lib/base.ts detectBasePath().
    (function () {
      var p = location.pathname;
      var prefix = p.indexOf("/backstage") === 0 ? "/backstage"
        : p.indexOf("/opensession") === 0 ? "/opensession" : "";
      var add = function (rel, href) {
        var l = document.createElement("link");
        l.rel = rel; l.href = href;
        document.head.appendChild(l);
      };
      add("apple-touch-icon", prefix + "/apple-touch-icon.png?v=4");
      add("manifest", prefix + "/manifest.webmanifest");

      // The desktop workspace shell follows the host OS's window language.
      // Mobile stays edge-to-edge, but setting this before first paint avoids a
      // radius jump in browsers and the desktop shell.
      var platform = (navigator.userAgentData && navigator.userAgentData.platform)
        || navigator.platform || "";
      document.documentElement.dataset.platform = /win/i.test(platform)
        ? "windows" : /mac/i.test(platform) ? "mac" : "linux";

      // Only updated desktop-shell builds provide a native visual-effect
      // backdrop. The capability check keeps the remotely served UI opaque in
      // older shells, which expose `desktop` but still use an opaque window.
      if (window.os1 && window.os1.materialBackdrop === true)
        document.documentElement.classList.add("material-backdrop");

      // Window Controls Overlay detection → `html.wco` (drives the titlebar
      // band + drag region in the foundation adapter). JS instead of the display-mode
      // media query because Electron (the OS¹ desktop shell) exposes the WCO
      // geometry while display-mode stays "browser". Re-evaluated on change so
      // fullscreen (controls auto-hide) drops the band, matching PWA behavior.
      var wcoMq = matchMedia("(display-mode: window-controls-overlay)");
      var updWco = function () {
        var wco = navigator.windowControlsOverlay;
        document.documentElement.classList.toggle(
          "wco", wcoMq.matches || !!(wco && wco.visible));
      };
      updWco();
      wcoMq.addEventListener("change", updWco);
      if (navigator.windowControlsOverlay)
        navigator.windowControlsOverlay.addEventListener("geometrychange", updWco);

      // iOS launch images: one PNG per device, matched by an exact media query
      // (logical width/height + pixel ratio + orientation). Generated by
      // scripts/gen-splash.py. Without these, the standalone PWA launches black.
      // [ptWidth, ptHeight, ratio, pxWidth, pxHeight]
      var splashes = [
        [320, 568, 2, 640, 1136],
        [375, 667, 2, 750, 1334],
        [414, 896, 2, 828, 1792],
        [375, 812, 3, 1125, 2436],
        [390, 844, 3, 1170, 2532],
        [393, 852, 3, 1179, 2556],
        [402, 874, 3, 1206, 2622],
        [414, 736, 3, 1242, 2208],
        [414, 896, 3, 1242, 2688],
        [428, 926, 3, 1284, 2778],
        [430, 932, 3, 1290, 2796],
        [440, 956, 3, 1320, 2868]
      ];
      splashes.forEach(function (s) {
        var l = document.createElement("link");
        l.rel = "apple-touch-startup-image";
        l.media = "screen and (device-width: " + s[0] + "px) and (device-height: " + s[1] +
          "px) and (-webkit-device-pixel-ratio: " + s[2] + ") and (orientation: portrait)";
        l.href = prefix + "/splash/apple-splash-" + s[3] + "-" + s[4] + ".png";
        document.head.appendChild(l);
      });
    })();
  </script>
  <style>
    body { background: #1b1b1b; color: #ececec; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
    html[data-theme="light"] body { background: #ffffff; color: #1c1a18; }
    html[data-theme="light"] #splash { background: radial-gradient(120% 90% at 50% 35%, #ffffff 0%, #f3f1ee 70%); }

    /* Splash screen — painted instantly from the HTML shell (before the JS
       bundle parses) so the PWA launch shows branding, not a blank dark frame.
       React removes #splash once it mounts (see App.tsx). */
    #splash {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      background: radial-gradient(120% 90% at 50% 35%, #262626 0%, #1b1b1b 70%);
      opacity: 1;
      transition: opacity 0.35s ease;
    }
    #splash.splash-hide { opacity: 0; pointer-events: none; }
    .splash-logo {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 76px;
      height: 76px;
      animation: splash-pulse 1.6s ease-in-out infinite;
    }
    .splash-logo img {
      display: block;
      width: 76px;
      height: 76px;
    }
    .splash-bars {
      display: flex;
      align-items: center;
      gap: 5px;
      height: 14px;
    }
    .splash-bars span {
      width: 4px;
      border-radius: 2px;
      background: currentColor;
      animation: splash-bar 1s ease-in-out infinite;
    }
    .splash-bars span:nth-child(1) { height: 6px;  opacity: 0.4; animation-delay: 0s; }
    .splash-bars span:nth-child(2) { height: 10px; opacity: 0.7; animation-delay: 0.15s; }
    .splash-bars span:nth-child(3) { height: 14px; opacity: 1;   animation-delay: 0.3s; }
    .splash-bars span:nth-child(4) { height: 10px; opacity: 0.7; animation-delay: 0.45s; }
    .splash-bars span:nth-child(5) { height: 6px;  opacity: 0.4; animation-delay: 0.6s; }
    @keyframes splash-pulse {
      0%, 100% { transform: scale(1); }
      50%      { transform: scale(1.04); }
    }
    @keyframes splash-bar {
      0%, 100% { transform: scaleY(0.6); }
      50%      { transform: scaleY(1); }
    }
    @media (prefers-reduced-motion: reduce) {
      .splash-logo, .splash-bars span { animation: none; }
    }
  </style>
</head>
<body>
  <div id="splash">
    <span class="splash-logo"><img src="/mac-app-icon.png" alt="" /></span>
    <span class="splash-bars"><span></span><span></span><span></span><span></span><span></span></span>
  </div>
  <div id="root"></div>
  <script type="module" src="./App.tsx"></script>
</body>
</html>

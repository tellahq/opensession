name: CI

# The server had no CI at all — the other workflows in here are client-app
# releases. This runs on every PR: type-check, the unit suite, and an actual
# end-to-end install on both Linux and macOS.
#
# The macOS job matters more than it looks. macOS support (Homebrew prerequisite
# installs, darwin Bun targets, LaunchAgent service management) was written
# without a Mac to test on, so CI is the only thing standing between "we wrote
# macOS code" and "macOS works".

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Nothing here needs to write. A fork PR's token is read-only regardless, but
# this also covers push events on the base repo.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Type-check and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      # Pinned to a SHA, not a tag: this is the one third-party action that runs
      # on every pull request, and a moved tag would execute in CI unreviewed.
      # (v2.2.0 at time of pinning.)
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type-check
        run: bun run typecheck

      # The unit suite is NOT a gate yet, and that is a deliberate call rather
      # than laziness: it is ORDER DEPENDENT, and the order is not stable
      # between identical runs, so neither colour means what a gate needs it to
      # mean.
      #
      # Measured 2026-08-16, one commit, clean detached worktree, four
      # consecutive sweeps of exactly this command: two green at 2904 pass, two
      # red. The red ones did not agree with each other. Both flagged the two
       # cases in zz-pr-cache-staleness.test.ts, which sit at 5000ms (their
       # timeout) in the sweep and pass in 54ms run alone.
      #
      # So a red build would not reliably mean "you broke something" — and, the
      # half people forget, a green sweep is not evidence the ordering is fixed:
      # it was green half the time with the problem fully present. Two runs are
      # not enough to conclude anything either. The three files that failed
      # outright when this workflow was written (zz-opencode-mirror,
      # opencode-transcript, sessions.test.ts) have since been fixed; the shared
      # state between files has not.
      #
      # It still runs on every PR so regressions are visible in the log, and the
      # type-check plus the real end-to-end installs below ARE gates.
      #
      # Fixing this means finding the cross-file state (this codebase parks a lot
      # on globalThis) and isolating it. Then delete continue-on-error, on the
      # evidence of repeated sweeps rather than one.
      #
       # These two directories are where every server-side test lives.
      - name: Unit tests (reported, not yet a gate — see comment)
        continue-on-error: true
        run: bun test src scripts

      # The snapshot scenarios are exactly the part of that sweep the ordering
      # problem eats: they redirect the sessions dir, transcript store, MCP
      # config and memory store, and when an earlier file has already frozen
      # those they skip themselves rather than snapshot the runner's own data.
      # So they only protect anything when run on their own, which is what this
      # step does. Unlike the sweep it IS a gate: one file, no key, no network,
      # no engine subprocess, and it fails if the harness comes up unready.
      - name: Transcript snapshots
        run: bun run test:snapshots

  installer:
    name: Install (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Lint the installer
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          bash -n install.sh
          # Style-only findings should not fail the build; real bugs should.
          shellcheck --severity=warning install.sh

      # Deliberately NOT pre-installing Bun: bootstrapping it is part of what
      # the installer is being tested for.
      - name: Install from this checkout
        # OPENSESSION_ALLOW_IMDS: hosted runners answer on 169.254.169.254
        # (Azure metadata) with no role attached; without the override the
        # installer would rightly refuse the user service on such a box.
        run: |
          OPENSESSION_REPO="file://$GITHUB_WORKSPACE" \
          OPENSESSION_HOME="$HOME/.opensession" \
          OPENSESSION_ALLOW_IMDS=1 \
            bash install.sh --yes --no-engine

      - name: Put the command and bun on PATH for later steps
        # Steps do not share a shell and do not source profiles, so the
        # installer's profile edits are invisible here. install.sh already
        # appends its own bin dir when GITHUB_PATH is set; bun needs adding too.
        run: |
          echo "$HOME/.opensession/bin" >> "$GITHUB_PATH"
          echo "$HOME/.bun/bin" >> "$GITHUB_PATH"

      - name: The command exists and runs
        run: |
          opensession version
          opensession --help > /dev/null

      - name: PATH survives a non-interactive login shell
        if: runner.os == 'Linux'
        # Regression guard: appending only to ~/.bashrc is invisible to
        # non-interactive shells, so `opensession` worked when typed and not
        # when scripted.
        run: bash -lc 'opensession version'

      - name: Doctor reports no errors
        run: opensession doctor

      - name: Service definition renders for this platform
        run: |
          cd "$HOME/.opensession/src"
          bun -e '
            import { renderPlist, renderUnit, supervisor } from "./scripts/lib/service";
            const kind = supervisor();
            console.log("supervisor:", kind);
            const text = kind === "launchd" ? renderPlist() : await renderUnit();
            if (!text.includes("opensession.ts")) throw new Error("no ExecStart");
            const user = text.match(/^User=(.*)$/m)?.[1];
            if (user === "unknown") throw new Error("User=unknown would fail 217/USER");
            console.log("service definition ok");
          '

      - name: Recipes are installable
        run: |
          opensession automations
          opensession automations add instance-health
          opensession automations | grep -q "added"

      - name: Uninstall cleanly
        run: bash install.sh --uninstall

  runner-windows:
    # Same situation as the macOS installer job above: the Windows Runner
    # client (install.ps1, the scheduled-task service, PowerShell command
    # execution, the Windows env whitelist) was written without a Windows box
    # to test on, so CI is the only thing standing between "we wrote Windows
    # code" and "Windows works".
    name: Windows runner client
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14

      - name: Install from this checkout
        shell: pwsh
        run: ./install.ps1 -Repo "$env:GITHUB_WORKSPACE" -NoModifyPath

      - name: The command exists and runs
        shell: pwsh
        run: |
          opensession version
          opensession --help | Out-Null
          opensession runner status

      - name: Runner client unit tests
        shell: pwsh
        run: |
          Set-Location (Join-Path $env:USERPROFILE ".opensession\src")
          bun test scripts/lib/connect.test.ts scripts/lib/service.test.ts

      # The regression test for the Runner that could not run anything: every
      # delegated command died at spawn with ENOENT on powershell.exe because
      # System32 was not on that machine's PATH. A GitHub image has a pristine
      # PATH, so the only way to catch it here is to break PATH on purpose.
      - name: Delegated commands run with System32 off PATH
        shell: pwsh
        run: |
          Set-Location (Join-Path $env:USERPROFILE ".opensession\src")
          $code = @'
          import { resolveWindowsSchtasks, resolveWindowsShell, runnerExecCommand, windowsRunnerEnvironment } from "./scripts/lib/connect.ts";

          const shell = resolveWindowsShell();
          console.log("resolved shell:", shell);
          if (!/system32|pwsh/i.test(shell)) throw new Error(`resolved a bare name on a healthy image: ${shell}`);
          const schtasks = resolveWindowsSchtasks();
          console.log("resolved schtasks:", schtasks);
          if (!schtasks) throw new Error("schtasks.exe did not resolve");

          // A PATH that cannot reach System32, which is the broken machine.
          const broken = {
            PATH: "C:\\nope",
            PATHEXT: process.env.PATHEXT ?? "",
            SystemRoot: process.env.SystemRoot ?? "",
            TEMP: process.env.TEMP ?? "",
            USERPROFILE: process.env.USERPROFILE ?? "",
          };
          const env = windowsRunnerEnvironment(broken);
          console.log("repaired PATH:", env.PATH ?? env.Path);

          let bareCode: number | string;
          try {
            const bare = Bun.spawn(["powershell.exe", "-NoProfile", "-NonInteractive", "-Command", "Write-Output bare"], { env, stdout: "pipe", stderr: "pipe" });
            bareCode = await bare.exited;
          } catch (error) {
            bareCode = `spawn failed: ${error instanceof Error ? error.message : String(error)}`;
          }
          console.log("bare powershell.exe with System32 off PATH:", bareCode);

          const argv = runnerExecCommand("Write-Output ok-from-runner");
          const proc = Bun.spawn(argv, { env, stdout: "pipe", stderr: "pipe" });
          const [out, err, code] = await Promise.all([
            new Response(proc.stdout).text(),
            new Response(proc.stderr).text(),
            proc.exited,
          ]);
          console.log("runner exec exit", code, JSON.stringify(out.trim()), err.trim().slice(0, 300));
          if (code !== 0 || !out.includes("ok-from-runner")) throw new Error("the Runner exec path could not spawn with System32 off PATH");

          // Spawning is only half of it: what the shell then runs is written by
          // a person, and says git, where, Get-CimInstance. Those resolve
          // through the child PATH, so prove that is repaired too.
          const inner = Bun.spawn(runnerExecCommand("where.exe cmd.exe"), { env, stdout: "pipe", stderr: "pipe" });
          const [innerOut, innerErr, innerCode] = await Promise.all([
            new Response(inner.stdout).text(),
            new Response(inner.stderr).text(),
            inner.exited,
          ]);
          console.log("inner where.exe exit", innerCode, innerOut.trim(), innerErr.trim().slice(0, 300));
          if (innerCode !== 0 || !/cmd\.exe/i.test(innerOut)) throw new Error("a System32 tool did not resolve inside a delegated command");
          console.log("exec round-trip ok");
          '@
          bun -e $code

      - name: Runner service installs as a scheduled task
        shell: pwsh
        run: |
          opensession runner service install
          schtasks /Query /TN OpenSessionRunner /FO LIST /V
          # The action must name a fully qualified PowerShell. A bare name here
          # means the task silently launches nothing when PATH is damaged at
          # sign-in, and the Runner just never appears online.
          $xml = (schtasks /Query /TN OpenSessionRunner /XML) -join "`n"
          if ($xml -notmatch 'WindowsPowerShell') { throw "the task action does not name a fully qualified PowerShell" }
          schtasks /Delete /TN OpenSessionRunner /F

      - name: Uninstall cleanly
        shell: pwsh
        run: ./install.ps1 -Uninstall

# Publish the release artefacts the default install downloads.
#
# `install.sh` with no flags fetches
#   https://github.com/tellahq/opensession/releases/latest/download/opensession-<os>-<arch>.tar.gz
# so every release carries, beside its versioned tarballs, one stable alias per
# target. scripts/build-compile.ts cross-compiles per target (bun --target, nothing executes target
# binaries), so one Linux runner builds all four. Pi is bundled into the binary,
# so there is no engine seed to prebuild.
#
# GitHub's immutable releases lock their tag and assets at publication. Every
# release producer therefore uploads to the same draft. release-finalize.yml
# publishes it only after the compiled and Mac workflows both succeed.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing draft release tag to build"
        required: true

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  artefacts:
    name: Build and upload
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - name: Prepare release draft
        if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          if is_draft="$(gh release view "$TAG" --json isDraft --jq '.isDraft' 2>/dev/null)"; then
            if [ "$is_draft" != "true" ]; then
              echo "::error title=Release is already immutable::$TAG is already published. Create the next release as a draft, or push only its tag and let the release workflows publish it."
              exit 1
            fi
          elif ! gh release create "$TAG" --verify-tag --draft --title "$TAG" --generate-notes; then
            sleep 2
            is_draft="$(gh release view "$TAG" --json isDraft --jq '.isDraft')"
            test "$is_draft" = "true"
          fi
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.0
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build artefacts
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          out="$RUNNER_TEMP/release"
          mkdir -p "$out/assets"
          export SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)"
          for target in linux/x64 linux/arm64 darwin/x64 darwin/arm64; do
            os="${target%/*}"; arch="${target#*/}"
            # The default artefact is the compiled single-executable
            # (build-compile.ts, cross-compiled per target). The source install
            # path is a git checkout, so no tarball is published for it.
            bun scripts/build-compile.ts --version "$version" --os "$os" --arch "$arch" --out "$out"
            versioned="$out/opensession-$version-$os-$arch.tar.gz"
            test -s "$versioned"
            cp "$versioned" "$out/assets/"
            cp "$versioned" "$out/assets/opensession-$os-$arch.tar.gz"
          done
          cd "$out/assets"
          for asset in *.tar.gz; do
            hash="$(sha256sum "$asset" | awk '{ print $1 }')"
            printf '%s  %s\n' "$hash" "$asset" > "$asset.sha256"
          done
          ls -la "$out/assets"
      - name: Smoke-test Linux binary
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          root="$RUNNER_TEMP/release-smoke"
          log="$root/server.log"
          kernel_log="$root/session-kernel.log"
          mkdir -p "$root"
          printf '%s\n' '{"provider":"local","publicIngress":{"enabled":true,"port":43860,"host":"127.0.0.1"}}' > "$root/sandbox.json"
          binary="$RUNNER_TEMP/release/stage/opensession-$version-linux-x64/opensession"
          common_env=(
            OPENSESSION_STATE_DIR="$root/state"
            OPENSESSION_SANDBOX_CONFIG="$root/sandbox.json"
            OPENSESSION_SESSION_KERNEL_PORT=43849
            OPENSESSION_SESSION_KERNEL_TOKEN=release-smoke-token
          )
          env "${common_env[@]}" "$binary" session-kernel-service > "$kernel_log" 2>&1 &
          kernel_pid=$!
          pid=""
          cleanup() {
            status=$?
            kill ${pid:+"$pid"} "$kernel_pid" 2>/dev/null || true
            if [ -n "$pid" ]; then wait "$pid" 2>/dev/null || true; fi
            wait "$kernel_pid" 2>/dev/null || true
            if [ "$status" -ne 0 ]; then
              cat "$kernel_log"
              test ! -f "$log" || cat "$log"
            fi
            exit "$status"
          }
          trap cleanup EXIT
          # The gateway deliberately refuses an unseeded catalog. Initialize the
          # fresh smoke fixture via the supported offline importer, not a live
          # gateway filesystem scan or a weakened readiness check.
          env "${common_env[@]}" bun scripts/seed-session-metadata-catalog.ts
          env "${common_env[@]}" \
            OPENSESSION_MCP_HTTP_PORT=43852 \
            HOST=127.0.0.1 \
            PORT=43850 \
            OPENSESSION_PUBLIC_URL=http://127.0.0.1:43850 \
            "$binary" server > "$log" 2>&1 &
          pid=$!
          curl --fail --silent --show-error --retry 20 --retry-delay 1 --retry-connrefused \
            http://127.0.0.1:43850/api/health > "$root/health.json"
          grep -Fq 'Frontend served from embedded assets' "$log"
      - name: Attest release archives
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: ${{ runner.temp }}/release/assets/*.tar.gz
      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          assets="$RUNNER_TEMP/release/assets"
          gh release upload "$TAG" "$assets"/* --clobber
          gh release view "$TAG" --json assets --jq '.assets[] | select(.state == "uploaded" and .size > 0) | .name' > "$RUNNER_TEMP/uploaded-assets"
          for asset in "$assets"/*; do
            name="${asset##*/}"
            if ! grep -Fqx "$name" "$RUNNER_TEMP/uploaded-assets"; then
              echo "::error title=Release asset is missing::$name was not uploaded to the draft."
              exit 1
            fi
          done

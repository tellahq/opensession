name: Dependency audit

on:
  pull_request:
    paths:
      - package.json
      - "packages/**/package.json"
      - bun.lock
      - packages/clients/mac/bun.lock
      - .github/workflows/dependency-audit.yml
  push:
    branches: [main]
    paths:
      - package.json
      - "packages/**/package.json"
      - bun.lock
      - packages/clients/mac/bun.lock
      - .github/workflows/dependency-audit.yml
  schedule:
    - cron: "23 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    name: High and critical production advisories
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0

      - name: Install locked dependencies
        run: |
          bun install --frozen-lockfile --ignore-scripts
          bun install --cwd packages/clients/mac --frozen-lockfile --ignore-scripts

      # Bun audits the complete locked graph. This includes every production
      # dependency and is intentionally stricter than filtering out dev tools.
      - name: Audit dependencies
        run: |
          bun audit --audit-level=high
          cd packages/clients/mac && bun audit --audit-level=high

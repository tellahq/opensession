<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#222222" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <!-- The label under the icon once iOS installs this to the Home Screen. It is
       the short mark, not the full name: iOS truncates at about 12 characters,
       and the app's own label is OS on every other client too. The manifest's
       short_name (routes/static-assets.ts) follows branding.productMark; this
       file is built, so it carries the default. -->
    <meta name="apple-mobile-web-app-title" content="OS" />
    <!-- The favicon (added by the runtime script below) and the link-preview
       image follow the workspace artwork (routes/static-assets.ts), falling
       back to the Open Session mark. Safari's installer probes these alongside
       the touch icon, so they must agree. -->
    <title>Open Session</title>
    <!-- OpenGraph / Twitter link-preview image. Root-relative so it resolves at
       the bare domain root and under the /backstage & /opensession prefixes. -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Open Session" />
    <meta property="og:image" content="/favicon.png?v=7" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Open Session" />
    <meta name="twitter:image" content="/favicon.png?v=7" />
    <!-- Replaced by the production builder. Dev/source builds keep generic defaults. -->
    <script>
      window.__OPENSESSION_INSTANCE__ = window.__OPENSESSION_INSTANCE__ || {};
    </script>
    <script>
      // Pre-paint appearance: set light/dark and the accent before first paint,
      // so there's no flash of the fallback palette. Mirrors lib/theme.ts and
      // lib/accent-theme.ts — keep both keys and valid accent values in sync.
      (function () {
        try {
          var p = localStorage.getItem("opensession-theme");
          var eff =
            p === "light" || p === "dark"
              ? p
              : window.matchMedia("(prefers-color-scheme: light)").matches
                ? "light"
                : "dark";
          var h = document.documentElement;
          h.setAttribute("data-theme", eff);
          if (
            localStorage.getItem("opensession-diff-palette") === "colorblind"
          ) {
            h.setAttribute("data-diff-palette", "colorblind");
          }
          var accent = localStorage.getItem("opensession-accent");
          // Accents whose colour was retired; keep in sync with RETIRED_THEMES in
          // lib/accent-theme.ts, which is what runs once the bundle is up.
          var retired = {
            gold: "lime",
            purple: "coral",
            pink: "coral",
            brown: "orange",
            teal: "sky",
          };
          if (retired[accent]) {
            accent = retired[accent];
            localStorage.setItem("opensession-accent", accent);
          }
          var accents = [
            "sky",
            "indigo",
            "coral",
            "orange",
            "lime",
            "green",
            "mono",
          ];
          h.setAttribute(
            "data-accent",
            accents.indexOf(accent) >= 0 ? accent : "sky",
          );
          h.style.colorScheme = eff;
          var m = document.querySelector('meta[name="theme-color"]');
          // --bg-raised (sidebar + WCO titlebar surface): the desktop PWA paints
          // the window-controls caption band with theme-color, so match the
          // titlebar. Keep in sync with lib/theme.ts applyTheme().
          if (m)
            m.setAttribute("content", eff === "light" ? "#f6f6f6" : "#222222");
        } catch (e) {}
      })();
    </script>
    <script>
      // Injected at runtime so the bundler doesn't try to resolve these as build
      // assets — they're served by the Open Session server, not bundled. The
      // prefix follows the URL this page was served under (/opensession/ primary,
      // /backstage/ legacy alias, or "" at a bare domain root)
      // so each install's PWA identity — manifest, start_url, icons — stays
      // self-consistent per prefix. Mirrors lib/base.ts detectBasePath().
      (function () {
        var p = location.pathname;
        var prefix =
          p.indexOf("/backstage") === 0
            ? "/backstage"
            : p.indexOf("/opensession") === 0
              ? "/opensession"
              : "";
        var add = function (rel, href, sizes) {
          var l = document.createElement("link");
          l.rel = rel;
          l.href = href;
          if (sizes) l.setAttribute("sizes", sizes);
          document.head.appendChild(l);
        };
        add("icon", prefix + "/favicon.png?v=7");
        add(
          "apple-touch-icon",
          prefix + "/apple-touch-icon.png?v=6",
          "180x180",
        );
        add("manifest", prefix + "/manifest.webmanifest");

        // Tailwind utilities. The production builder appends its own hashed
        // tailwind-<hash>.css just before the head close tag — AFTER this script runs,
        // so the check waits for the parsed document. No such link means Bun's
        // HMR dev server is serving this page (OPENSESSION_DEV=1), and Bun can't
        // compile Tailwind: pull the sheet the server compiles for dev instead.
        // Without it a dev/demo instance renders with no utilities at all.
        document.addEventListener("DOMContentLoaded", function () {
          if (
            !document.querySelector('link[rel="stylesheet"][href*="tailwind-"]')
          ) {
            // StyleX first: Tailwind utilities win ties against it, as in
            // the prod bundle where StyleX ends the global sheet.
            add("stylesheet", prefix + "/stylex.css");
            add("stylesheet", prefix + "/tailwind.css");
          }
        });

        // The desktop workspace shell follows the host OS's window language.
        // Mobile stays edge-to-edge, but setting this before first paint avoids a
        // radius jump in browsers and the desktop shell.
        var platform =
          (navigator.userAgentData && navigator.userAgentData.platform) ||
          navigator.platform ||
          "";
        document.documentElement.dataset.platform = /win/i.test(platform)
          ? "windows"
          : /mac/i.test(platform)
            ? "mac"
            : "linux";

        // iOS 26 can expose a standalone viewport shorter than the physical
        // screen by exactly the status-bar inset. Viewport units inherit that
        // bad height. Forcing the document-flow roots to screen.height makes
        // WebKit recalculate the standalone window to the full device surface.
        var iphoneStandalone =
          /iPhone|iPod/.test(navigator.userAgent) &&
          (matchMedia("(display-mode: standalone)").matches ||
            navigator.standalone === true);
        if (iphoneStandalone) {
          // The correction only works if WebKit answers it by re-laying the
          // standalone window out. When it keeps the short window, the roots
          // stand taller than what you can see, and everything anchored to the
          // bottom of the app (the composer) falls below the fold with no way
          // to scroll it back. Measure the result and hand the height back when
          // that happens: a letterboxed strip is better than a cut-off composer.
          var standaloneFillTaken = true;
          var standaloneVerifyTimer;
          var standaloneSettleTimers = [];
          var cancelStandaloneTimers = function () {
            clearTimeout(standaloneVerifyTimer);
            standaloneSettleTimers.forEach(clearTimeout);
            standaloneSettleTimers = [];
          };
          var setRootHeight = function (value) {
            document.documentElement.style.height = value;
            if (document.body) document.body.style.height = value;
          };
          var keyboardOpen = function () {
            return (
              !!document.body && document.body.classList.contains("kb-open")
            );
          };
          var verifyStandaloneScreen = function (height) {
            // An open keyboard shrinks the window on purpose, so it can neither
            // confirm nor disprove the correction.
            if (document.hidden || !standaloneFillTaken || keyboardOpen())
              return;
            if (window.innerHeight >= height - 1) return;
            standaloneFillTaken = false;
            setRootHeight("");
          };
          var fillStandaloneScreen = function () {
            var height = window.screen.height;
            if (
              document.hidden ||
              !height ||
              !standaloneFillTaken ||
              keyboardOpen()
            )
              return;
            setRootHeight(height + "px");
            clearTimeout(standaloneVerifyTimer);
            standaloneVerifyTimer = setTimeout(function () {
              verifyStandaloneScreen(height);
            }, 300);
          };
          var resyncStandaloneScreen = function () {
            cancelStandaloneTimers();
            if (document.hidden) return;
            // A short reading only rejects this attempt, not the lifetime of
            // the PWA. Resume and keyboard dismissal can repair WebKit's window
            // without a reload. Retry through their animation, then keep the
            // same visible-height safeguard if the window really stays short.
            standaloneFillTaken = true;
            fillStandaloneScreen();
            standaloneSettleTimers = [250, 500].map(function (delay) {
              return setTimeout(fillStandaloneScreen, delay);
            });
          };
          fillStandaloneScreen();
          document.addEventListener("DOMContentLoaded", fillStandaloneScreen, {
            once: true,
          });
          window.addEventListener("resize", fillStandaloneScreen);
          window.addEventListener("orientationchange", resyncStandaloneScreen);
          window.addEventListener("pageshow", resyncStandaloneScreen);
          window.addEventListener("pagehide", cancelStandaloneTimers);
          document.addEventListener("visibilitychange", resyncStandaloneScreen);
          // focusout precedes the app removing kb-open. The delayed attempts
          // wait for that class and the keyboard animation to settle.
          document.addEventListener("focusout", resyncStandaloneScreen);

          // iOS 26.6+ can bring a standalone web app back from the background,
          // or out of a keyboard cycle, with a phantom keyboard-sized visual
          // viewport inset while nothing is focused (WebKit bugs 322900 and
          // 323322). The next gesture then pans the visual viewport by that
          // inset. The app's body is position: fixed, so it rides the pan and
          // every control looks in place, but WebKit keeps painting against the
          // unpanned layout viewport: the fixed navigation bar at the top is
          // not painted at all and the transcript's tiles above the pan height
          // stay unpainted, a hard-edged band of page colour under the status
          // bar that lasts until the next scroll releases the pan. A keyboard
          // pan is the one legitimate case, and it always has a focused text
          // field; with nothing focused the pan is phantom, and scrolling the
          // window back to 0 releases it the way that next gesture would.
          var viewport = window.visualViewport;
          if (viewport && typeof window.scrollTo === "function") {
            var editableFocused = function () {
              var el = document.activeElement;
              if (!el) return false;
              return (
                el.tagName === "TEXTAREA" ||
                el.tagName === "INPUT" ||
                el.isContentEditable === true
              );
            };
            // What each attempt saw, for the Debug > Viewport readout: the
            // readings are only observable on the affected device.
            var panRelease = {
              runs: 0,
              released: 0,
              reason: "idle",
              pan: 0,
              scrollY: 0,
              scale: 1,
              viewportEvents: 0,
              scrollerEvents: 0,
            };
            window.__os1PanRelease = panRelease;
            var releasePhantomPan = function () {
              panRelease.runs++;
              var pan = (panRelease.pan = viewport.offsetTop || 0);
              var scrolled = (panRelease.scrollY = window.scrollY || 0);
              panRelease.scale = viewport.scale;
              panRelease.reason = document.hidden
                ? "hidden"
                : keyboardOpen()
                  ? "keyboard"
                  : editableFocused()
                    ? "focused"
                    : viewport.scale !== 1
                      ? "scale"
                      : pan <= 0 && scrolled <= 0
                        ? "rest"
                        : "released";
              if (panRelease.reason !== "released") return;
              panRelease.released++;
              window.scrollTo(0, 0);
            };
            // The keyboard's own dismissal animates the pan back to 0 through
            // a run of viewport scroll events with nothing focused; waiting
            // out the last one leaves that animation alone and only touches a
            // pan that has come to rest.
            var panReleaseTimer;
            var scheduleRelease = function (delay) {
              clearTimeout(panReleaseTimer);
              panReleaseTimer = setTimeout(releasePhantomPan, delay);
            };
            var onViewportMove = function () {
              panRelease.viewportEvents++;
              scheduleRelease(120);
            };
            // The gesture that pans the visual viewport is a scroll of the
            // transcript, which reaches the window only as a captured scroll
            // event; a pan the viewport reports no event for is still caught
            // once that scroll, or the touch behind it, is over.
            var onScrollerMove = function () {
              panRelease.scrollerEvents++;
              scheduleRelease(120);
            };
            var onViewportSettle = function () {
              scheduleRelease(600);
            };
            viewport.addEventListener("scroll", onViewportMove);
            viewport.addEventListener("resize", onViewportMove);
            window.addEventListener("scroll", onViewportMove);
            document.addEventListener("scroll", onScrollerMove, true);
            document.addEventListener("touchend", onScrollerMove);
            document.addEventListener("focusout", onViewportSettle);
            document.addEventListener("visibilitychange", onViewportSettle);
            window.addEventListener("pageshow", onViewportSettle);
          }
        }

        // The Electron shell owns a hidden native titlebar even when Chromium
        // temporarily stops reporting Window Controls Overlay geometry. Keep a
        // separate capability class so its drag regions do not depend on that
        // transient browser API.
        if (window.os1 && window.os1.desktop === true)
          document.documentElement.classList.add("desktop-shell");

        // Only updated desktop-shell builds provide a native visual-effect
        // backdrop. The capability check keeps the remotely served UI opaque in
        // older shells, which expose `desktop` but still use an opaque window.
        if (window.os1 && window.os1.materialBackdrop === true)
          document.documentElement.classList.add("material-backdrop");

        // Shells that can move their traffic lights onto the web app's row
        // let the new layout use its shorter row there too (app-shell-classes,
        // NEW_LAYOUT_ROW_HEIGHT); older ones keep the 48px row the lights fit.
        if (window.os1 && typeof window.os1.setTitlebarHeight === "function")
          document.documentElement.classList.add("titlebar-follows-row");

        // Window Controls Overlay detection → `html.wco` (drives the titlebar
        // band + drag region in base.css). JS instead of the display-mode
        // media query because Electron (the Open Session desktop shell) exposes the WCO
        // geometry while display-mode stays "browser". Re-evaluated on change so
        // fullscreen (controls auto-hide) drops the band, matching PWA behavior.
        var wcoMq = matchMedia("(display-mode: window-controls-overlay)");
        var updWco = function () {
          var wco = navigator.windowControlsOverlay;
          document.documentElement.classList.toggle(
            "wco",
            wcoMq.matches || !!(wco && wco.visible),
          );
        };
        updWco();
        wcoMq.addEventListener("change", updWco);
        if (navigator.windowControlsOverlay)
          navigator.windowControlsOverlay.addEventListener(
            "geometrychange",
            updWco,
          );

        // iOS launch images: one PNG per device, matched by an exact media query
        // (logical width/height + pixel ratio + orientation). Generated by
        // scripts/gen-splash.py. Without these, the standalone PWA launches black.
        // [ptWidth, ptHeight, ratio, pxWidth, pxHeight]
        var splashes = [
          [320, 568, 2, 640, 1136],
          [375, 667, 2, 750, 1334],
          [414, 896, 2, 828, 1792],
          [375, 812, 3, 1125, 2436],
          [390, 844, 3, 1170, 2532],
          [393, 852, 3, 1179, 2556],
          [402, 874, 3, 1206, 2622],
          [414, 736, 3, 1242, 2208],
          [414, 896, 3, 1242, 2688],
          [428, 926, 3, 1284, 2778],
          [430, 932, 3, 1290, 2796],
          [440, 956, 3, 1320, 2868],
        ];
        splashes.forEach(function (s) {
          var l = document.createElement("link");
          l.rel = "apple-touch-startup-image";
          l.media =
            "screen and (device-width: " +
            s[0] +
            "px) and (device-height: " +
            s[1] +
            "px) and (-webkit-device-pixel-ratio: " +
            s[2] +
            ") and (orientation: portrait)";
          l.href =
            prefix + "/splash/apple-splash-" + s[3] + "-" + s[4] + ".png?v=4";
          document.head.appendChild(l);
        });
      })();
    </script>
    <style>
      body {
        background: #1b1b1b;
        color: #ececec;
        font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      }
      html[data-theme="light"] body {
        background: #ffffff;
        color: #1c1a18;
      }
      html[data-theme="light"] #splash {
        background: radial-gradient(
          120% 90% at 50% 35%,
          #ffffff 0%,
          #f3f1ee 70%
        );
      }

      /* Splash screen — painted instantly from the HTML shell (before the JS
       bundle parses) so the PWA launch shows branding, not a blank dark frame.
       React removes #splash once it mounts (see App.tsx). */
      #splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: radial-gradient(
          120% 90% at 50% 35%,
          #262626 0%,
          #1b1b1b 70%
        );
        opacity: 1;
        transition: opacity 0.35s ease;
      }
      #splash.splash-hide {
        opacity: 0;
        pointer-events: none;
      }
      .splash-logo {
        position: relative;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 88px;
        height: 88px;
        animation: splash-pulse 1.6s ease-in-out infinite;
      }
      .splash-logo img {
        display: block;
        width: 88px;
        height: 88px;
      }
      /* The pressed-in mark (the script after #splash): the same icon drawn
       by a shader into the page, with room around it for the ripples. Its
       first frame is the plain icon, so swapping it in for the img is
       invisible and the launch images from scripts/gen-splash.py still match. */
      .splash-depth {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 212px;
        height: 212px;
        margin: -106px 0 0 -106px;
        pointer-events: none;
        visibility: hidden;
      }
      .splash-sunk .splash-logo {
        animation: none;
      }
      .splash-sunk .splash-logo img {
        visibility: hidden;
      }
      .splash-sunk .splash-depth {
        visibility: visible;
      }
      @keyframes splash-pulse {
        0%,
        100% {
          transform: scale(1);
        }
        50% {
          transform: scale(1.04);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .splash-logo {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="splash">
      <span class="splash-logo"
        ><img src="/mac-app-icon.png?v=7" alt="" /><canvas
          class="splash-depth"
          aria-hidden="true"
        ></canvas
      ></span>
    </div>
    <script>
      // The launch mark, pressed into the page. One fragment shader opens on
      // the coloured icon the img was showing, then drains the colour out and
      // leaves only a quiet relief in the page's own surface: the square set
      // in, the S a small step, a slow wave ringing out from the edge every
      // beat and a light drifting across. Nothing is painted but light and
      // shadow, so it reads as part of the page in either theme.
      //
      // Plain script on purpose: it has to run before the bundle parses. It
      // draws only while #splash is in the document; without WebGL 2, or if the
      // context is lost, the plain img stays. Reduced motion gets one still
      // frame of the relief.
      (function () {
        var splash = document.getElementById("splash");
        var img = splash && splash.querySelector(".splash-logo img");
        var canvas = splash && splash.querySelector(".splash-depth");
        if (!img || !canvas) return;
        var gl;
        try {
          gl = canvas.getContext("webgl2", {
            alpha: true,
            premultipliedAlpha: true,
            antialias: false,
            powerPreference: "low-power",
          });
        } catch (e) {}
        if (!gl) return;
        var still = matchMedia("(prefers-reduced-motion: reduce)").matches;
        var fs = [
          "#version 300 es",
          "precision highp float;",
          "in vec2 v;",
          "out vec4 o;",
          "uniform sampler2D uTex;",
          "uniform float uTime, uIntro, uLight, uOver, uPx;",
          // The icon's rounded square, in icon units (the 88px box is -0.5..0.5).
          "float box(vec2 p) {",
          "  vec2 q = abs(p) - vec2(0.40) + 0.17;",
          "  return length(max(q, 0.0)) + min(max(q.x, q.y), 0.0) - 0.17;",
          "}",
          // Where the S divides the light half from the dark one: x as a
          // function of y, fitted to the artwork to within a pixel. Drawn
          // from a curve rather than read from the image, so the relief
          // stays smooth at any size.
          "float seam(float y) {",
          "  y = clamp(y, -0.4, 0.4);",
          "  return ((((((-82.9076 * y - 1.4411) * y + 24.7971) * y + 4.8378) * y - 2.5821) * y - 0.7953) * y + 0.0935);",
          "}",
          "vec2 uvOf(vec2 p) { return vec2(p.x + 0.5, 0.5 - p.y); }",
          // Height of the page: the square pressed in, the light half of the
          // S standing a little proud of the dark one, one wave per 2.4s beat
          // that leaves the edge and fades as it spreads, and a slow drift.
          "float surface(vec2 p, float t) {",
          "  float d = box(p);",
          "  float inside = smoothstep(0.03, -0.03, d);",
          "  float well = -0.012 * inside;",
          "  float lift = 0.007 * smoothstep(0.03, -0.03, p.x - seam(p.y)) * smoothstep(0.0, -0.05, d);",
          "  float r = max(d, 0.0);",
          "  float beat = fract(t / 2.4);",
          "  float y = (r - 0.02 - beat * 0.34) / 0.08;",
          "  float rings = 0.0026 * sin(y * 4.4) * exp(-y * y) * (1.0 - beat) * smoothstep(0.0, 0.06, r);",
          "  float drift = 0.0008 * (sin(p.x * 9.0 + t * 0.8) * sin(p.y * 7.0 - t * 0.6) + 0.7 * sin((p.x - p.y) * 13.0 + t * 1.1));",
          "  return well + lift + rings + drift * exp(-r * 9.0);",
          "}",
          "void main() {",
          "  vec2 p = v * uOver * 0.5;",
          "  float t = uTime;",
          "  float k = uIntro * uIntro * (3.0 - 2.0 * uIntro);",
          "  float e = uPx * uOver;",
          "  float h = surface(p, t);",
          "  vec3 n = normalize(vec3(-(surface(p + vec2(e, 0.0), t) - h) / e, -(surface(p + vec2(0.0, e), t) - h) / e, 1.0));",
          "  float d = box(p);",
          "  vec3 key = normalize(vec3(-0.4, 0.65, 1.0));",
          "  float shade = dot(n, key) - key.z;",
          "  vec3 lp = vec3(0.45 * cos(t * 0.5 + 0.6), 0.2 + 0.28 * sin(t * 0.5 + 0.6), 0.5);",
          "  vec3 hv = normalize(normalize(lp - vec3(p, 0.0)) + vec3(0.0, 0.0, 1.0));",
          "  float glint = pow(max(dot(n, hv), 0.0), 120.0);",
          "  float fade = smoothstep(1.0, 0.65, length(v));",
          // The dark half keeps the faintest trace of its ink.
          "  float ink = smoothstep(-0.01, 0.01, p.x - seam(p.y)) * smoothstep(0.0, -0.02, d) * mix(0.14, 0.05, uLight);",
          "  float light = (max(shade, 0.0) * mix(1.4, 2.4, uLight) + glint * 0.08) * fade;",
          "  float dark = max(-shade, 0.0) * mix(1.8, 0.9, uLight) * fade + ink;",
          "  vec4 glare = vec4(clamp(light, 0.0, 1.0));",
          "  vec4 relief = glare + (1.0 - glare.a) * vec4(0.0, 0.0, 0.0, clamp(dark, 0.0, 1.0));",
          // It opens on the coloured icon the img was showing, then most of the
          // colour drains out and leaves the mark in the page.
          "  vec4 icon = texture(uTex, uvOf(p));",
          "  o = mix(icon, relief, k * 0.86);",
          "}",
        ].join("\n");
        var vs =
          "#version 300 es\nin vec2 a;\nout vec2 v;\nvoid main() { v = a; gl_Position = vec4(a, 0.0, 1.0); }";
        var shader = function (type, src) {
          var s = gl.createShader(type);
          gl.shaderSource(s, src);
          gl.compileShader(s);
          return s;
        };
        var prog = gl.createProgram();
        gl.attachShader(prog, shader(gl.VERTEX_SHADER, vs));
        gl.attachShader(prog, shader(gl.FRAGMENT_SHADER, fs));
        gl.bindAttribLocation(prog, 0, "a");
        gl.linkProgram(prog);
        if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) return;
        gl.useProgram(prog);
        gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
        gl.bufferData(
          gl.ARRAY_BUFFER,
          new Float32Array([-1, -1, 3, -1, -1, 3]),
          gl.STATIC_DRAW,
        );
        gl.enableVertexAttribArray(0);
        gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
        var at = function (name) {
          return gl.getUniformLocation(prog, name);
        };
        var uTime = at("uTime");
        var uIntro = at("uIntro");
        var uLight = at("uLight");
        var uOver = at("uOver");
        var uPx = at("uPx");
        var lost = false;
        canvas.addEventListener("webglcontextlost", function () {
          lost = true;
          splash.classList.remove("splash-sunk");
        });
        var start = function () {
          if (lost || !img.naturalWidth) return;
          gl.bindTexture(gl.TEXTURE_2D, gl.createTexture());
          gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL, true);
          gl.texImage2D(
            gl.TEXTURE_2D,
            0,
            gl.RGBA,
            gl.RGBA,
            gl.UNSIGNED_BYTE,
            img,
          );
          gl.generateMipmap(gl.TEXTURE_2D);
          gl.texParameteri(
            gl.TEXTURE_2D,
            gl.TEXTURE_MIN_FILTER,
            gl.LINEAR_MIPMAP_LINEAR,
          );
          gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
          gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
          var t0 = 0;
          var frame = function (now) {
            if (lost || !splash.isConnected) return;
            if (!t0) t0 = now;
            var css = canvas.clientWidth || 212;
            var size = Math.round(css * Math.min(devicePixelRatio || 1, 3));
            if (canvas.width !== size) canvas.width = canvas.height = size;
            gl.viewport(0, 0, size, size);
            // The surface settles in over the first second, starting from
            // the flat icon the img was showing.
            var t = (now - t0) / 1000;
            gl.uniform1f(uTime, still ? 1.4 : t);
            gl.uniform1f(uIntro, still ? 1 : Math.min(1, t / 1.2));
            gl.uniform1f(
              uLight,
              document.documentElement.getAttribute("data-theme") === "light"
                ? 1
                : 0,
            );
            gl.uniform1f(uOver, css / 88);
            gl.uniform1f(uPx, 1 / size);
            gl.drawArrays(gl.TRIANGLES, 0, 3);
            splash.classList.add("splash-sunk");
            if (!still) requestAnimationFrame(frame);
          };
          requestAnimationFrame(frame);
        };
        if (img.complete) start();
        else img.addEventListener("load", start, { once: true });
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="./App.tsx"></script>
  </body>

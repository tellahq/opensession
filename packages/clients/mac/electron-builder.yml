# NOT dev.tella.os1. That id belongs to the App Store pair (the iOS app and
# the native OS1Mac target in os1-ios, one universal-purchase record). Two
# different Mac apps must never share a bundle id, so the Electron shell has
# its own.
#
# productName is the app's LABEL, and on macOS it is one knob for four things:
# the .app and executable names, CFBundleName (the menu-bar title), Electron's
# child-process lookup ("<CFBundleName> Helper.app" — a mismatch is a fatal
# "Unable to find helper app"), and Chromium's Keychain item ("<name> Safe
# Storage"). So it cannot be split: renaming the app means a new Keychain item,
# and everyone signs in once. The user-data folder is the exception, pinned in
# src/main.js so the profile no longer follows the label.
#
# The FULL name stays Open Session: the App Store record, the download, the
# website and prose all keep it. This is only the label.
appId: dev.tella.os1.shell
productName: OS
# Deliberately NOT renamed with the app: this is a URL path segment in the
# update feed, and isMacReleaseAsset in src/server/routes/os1-update.ts matches
# `OpenSession-*-arm64.zip` (and the older `OS1-*`). Leaving it alone is what
# keeps every installed copy updating across this rename. It reads as the full
# product name, which is also what a downloaded file should say.
artifactName: OpenSession-${version}-${arch}.${ext}
directories:
  buildResources: build
  output: dist
beforePack: scripts/before-pack.js
files:
  - src/**/*
# macOS 26 (Tahoe) renders apps that only ship a legacy .icns on a system
# backplate (looks like a border). The real icon is the Icon Composer document
# build/AppIcon.icon, compiled to build/Assets.car by scripts/compile-icon.sh
# (needs Xcode 26; artifacts are committed so CI never compiles). Assets.car +
# CFBundleIconName below make Tahoe render the native Liquid Glass icon; the
# icns stays as the pre-Tahoe fallback. Artwork source of truth:
# output/os1-icons/ at the repository root.
extraResources:
  - from: build/Assets.car
    to: Assets.car
  - from: build/vendor/os1-dictation
    to: os1-dictation
  - from: build/vendor/os-keychain
    to: os-keychain
  - from: ../../../LICENSE
    to: LICENSE
  - from: ../../../THIRD-PARTY-NOTICES.md
    to: THIRD-PARTY-NOTICES.md
  - from: ../../../THIRD-PARTY-LICENSES
    to: THIRD-PARTY-LICENSES
  - from: build/release-metadata
    to: release-metadata
mac:
  category: public.app-category.developer-tools
  icon: build/icon.icns
  # Open Session is currently English-only. Electron otherwise ships every
  # Chromium localization, which adds roughly 49 MB to the installed app.
  electronLanguages: [en]
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # Universal links: once the Developer ID provisioning profile for
  # dev.tella.os1.shell exists (README "Universal links"), switch ONLY `entitlements`
  # above to build/entitlements.mac.applinks.plist and add:
  # provisioningProfile: build/os1.provisionprofile
  # Leave `entitlementsInherit` on entitlements.mac.plist — the Electron helpers
  # have no provisioning profile, and macOS SIGKILLs a helper that claims the
  # associated-domains entitlement without one ("GPU process isn't usable.
  # Goodbye."). The release workflow encodes exactly this split.
  target:
    - target: dmg
      arch: [arm64]
    - target: zip
      arch: [arm64]
  extendInfo:
    CFBundleIconName: AppIcon
    # Without a usage description macOS never shows the microphone prompt, so
    # dictation fails as "denied" on the first try. This string is what the
    # system prompt shows. Pairs with com.apple.security.device.audio-input in
    # the entitlements.
    NSMicrophoneUsageDescription: Dictate prompts into the composer.
    NSSpeechRecognitionUsageDescription: Transcribe prompts while you speak.
    CFBundleURLTypes:
      - CFBundleURLName: Open Session deep link
        CFBundleURLSchemes: [os1]
  # Reads APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD / APPLE_TEAM_ID from the env in
  # CI; skipped (with a warning) when they're absent, e.g. local unsigned builds.
  notarize: true
dmg:
  # Sign the DMG container too (the app inside is signed + notarized + stapled
  # regardless) so `spctl --type open` accepts the disk image itself.
  sign: true

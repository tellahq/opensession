[Service]
# Keep the authoritative kernel healthy if its per-lane SQLite/store caches grow
# unexpectedly. Worker count remains CPU-scaled in code, which selects 16 lanes
# on the production 16-core host without oversubscribing smaller installations.
# The heap stays near 1 GB; the rest is SQLite page cache. At MemoryHigh=4G the
# kernel evicted its own cache and spent 10-15% of its time stalled on reads.
MemoryHigh=12G
MemoryMax=16G
MemorySwapMax=1G
OOMPolicy=stop
